server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: firewall_logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: zbf_firewall
          __path__: /var/log/ulogd_firewall.json

    pipeline_stages:
      - json:
          expressions:
            action: oob.prefix
            src_ip: "ip.saddr"
            dst_ip: "ip.daddr"
            dport: "l4.dport"
      - labels:
          action:
          src_ip:
          dport: